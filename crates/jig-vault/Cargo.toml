[package]
name = "jig-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local encrypted vault and redaction primitives for the jig-sh runtime."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["vault", "secrets", "agents", "cli"]
categories = ["command-line-utilities", "cryptography"]

[lib]
name = "jig_vault"

[features]
# Exposes explicit low-cost fixture constructors. Production constructors and
# serialized defaults remain production-strength even when this feature is
# compiled; callers must opt into the test-only constructor at the call site.
test-utils = []

[dependencies]
# Direct dependency for byte-only leftmost-longest streaming redaction. The
# existing Redactor is whole-buffer/lossy-output oriented; aho-corasick 1.1.x is
# MIT OR Unlicense and declares Rust 1.60, below this workspace's Rust 1.85 MSRV.
aho-corasick.workspace = true
anyhow.workspace = true
argon2.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
dirs.workspace = true
fs4.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
jig-owned-process.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tempfile.workspace = true
time.workspace = true
ulid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
