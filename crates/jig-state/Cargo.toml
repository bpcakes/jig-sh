test-support = []

[dependencies]
anyhow.workspace = true
flate2.workspace = true
fs4.workspace = true
jig-context.workspace = true
jig-contract.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
time.workspace = true
ulid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
jig-context = { workspace = true, features = ["test-support"] }
wait-timeout.workspace = true

[lints]
workspace = true
