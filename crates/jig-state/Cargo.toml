[package]
name = "jig-state"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Append-only repository state, run history, and leases for Jig."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "jig_state"

[features]
# Test clock, dashboard scan counters, and blocking lease helpers for
