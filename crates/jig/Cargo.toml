[package]
name = "jig-sh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agent-oriented repository harness and MCP runtime for Rust application repos."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords = ["agents", "cli", "mcp", "workflow"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "jig"

[[bin]]
name = "jig"
path = "src/main.rs"

[[test]]
name = "dev_sigint"
path = "tests/dev_sigint.rs"
required-features = ["dev-proxy"]

[[test]]
name = "dev_lifecycle"
path = "tests/dev_lifecycle.rs"
required-features = ["dev-proxy"]

[features]
# The default CLI build includes the local dev proxy. Library consumers that
# only need the harness/runtime API can use `default-features = false`.
default = ["dev-proxy"]
dev-proxy = ["dep:jig-dev-proxy"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
dotenvy.workspace = true
fs4.workspace = true
flate2.workspace = true
jig-contract.workspace = true
jig-codex-tui.workspace = true
jig-core.workspace = true
jig-dev-proxy = { workspace = true, optional = true }
jig-features.workspace = true
jig-owned-process.workspace = true
jig-status-tui.workspace = true
jig-tui.workspace = true
jig-ui.workspace = true
jig-vault.workspace = true
jig-vault-tui.workspace = true
libc.workspace = true
minijinja = { version = "2.19.0", features = ["custom_syntax", "json"] }
rpassword.workspace = true
# Rustyline 18 requires unicode-width 0.2.2, which cannot resolve alongside
# Ratatui 0.29's exact 0.2.0 requirement. Keep Rustyline 17 while Rust 1.85 and
# Ratatui 0.29 are the workspace constraints. Its default `with-dirs` feature is
# disabled because newer `home` releases require Rust 1.88.
rustyline = { version = "=17.0.2", default-features = false }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
tempfile.workspace = true
time.workspace = true
toml.workspace = true
ulid.workspace = true
wait-timeout.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
jig-vault = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true
