[package]
name = "jig-context"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Repository configuration, contract manifest, and validation for Jig."
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "jig_context"

[features]
# Validate dev-proxy TLDs with jig-dev-proxy's parser instead of the
# no-feature fallback in `validation.rs`.
dev-proxy = ["dep:jig-dev-proxy"]
# Resettable launcher context and repository fixtures for dependents' tests.
test-support = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
croner.workspace = true
globset.workspace = true
jig-contract.workspace = true
jig-core.workspace = true
jig-dev-proxy = { workspace = true, optional = true }
jig-features.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
ulid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
