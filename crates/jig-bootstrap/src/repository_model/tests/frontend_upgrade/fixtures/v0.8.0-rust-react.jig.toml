# Answers that jig 0.8.0 saved for a rust-react scaffold, without its
# machine-specific template-source keys.
repo_name = "exampleproject"
default_branch = "main"
ci_github_runner = "ubuntu-latest"
template_source_url = ""
harness_footprint = "full"

sqlx_enabled = false
rust_crate_roots = ["apps", "crates"]


schema_dump_enabled = false
schema_docs_dir = "docs/schema"


# Command values are project-owned. Generated Cargo defaults skip cleanly when
# no manifests are found; with nested manifests they run each one in turn.
# Review them against this repo's workspace layout and replace them when custom
# orchestration is needed.



web_package_manager = "bun"
application_contracts_enabled = true
frontend_workspace_roots = []


[[frontend_apps]]
name = "web"
dir = "apps/web"
coverage_threshold = 80
kind = "vite"
role = "spa"

[[frontend_apps]]
name = "admin-panel"
dir = "apps/admin-panel"
coverage_threshold = 80
kind = "vite"
role = "admin"




[repository]
default_check_profile = "verify"
affected_ignore = [".env", ".env.*", "**/.env", "**/.env.*", "README.md", "**/README.md", "AGENTS.md", "**/AGENTS.md", "agent-map.md", "CHANGELOG.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "SECURITY.md", "docs/**", "LICENSE", "LICENSE.*", ".github/**"]

[[repository.components]]
id = "admin-panel"
root = "apps/admin-panel"
description = "Frontend application 'admin-panel'."
tags = ["frontend", "admin"]
depends_on = ["api"]
adapters = ["typescript"]

[repository.components.provenance]
adapters = "inferred"
depends_on = "inferred"
id = "inferred"
root = "declared"

[[repository.components]]
id = "api"
root = "."
description = "Primary application backend."
tags = ["backend"]
propagate_affected_to_dependents = true
adapters = ["rust"]

[repository.components.provenance]
adapters = "inferred"
id = "inferred"
root = "inferred"

[[repository.components]]
id = "repo"
root = "."
description = "Repository-wide Jig policy and compatibility actions."
tags = ["repository"]
adapters = ["jig"]

[repository.components.provenance]
adapters = "inherited"
id = "inferred"
root = "inferred"

[[repository.components]]
id = "web"
root = "apps/web"
description = "Frontend application 'web'."
tags = ["frontend", "spa"]
depends_on = ["api"]
adapters = ["typescript"]

[repository.components.provenance]
adapters = "inferred"
depends_on = "inferred"
id = "inferred"
root = "declared"

