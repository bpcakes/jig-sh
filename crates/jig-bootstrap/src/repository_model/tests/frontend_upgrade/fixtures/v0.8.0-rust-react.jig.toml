[vault]
scope = "repo"
scope_id = "01M4PTJQMT7G2G1PB2J0241HXN"
allow_global = false


[commands]
admin_panel_build_command = "scripts/check-webapps.sh check-one apps/admin-panel 80 build:bundle"
admin_panel_lint_command = "scripts/check-webapps.sh check-one apps/admin-panel 80 lint"
admin_panel_test_command = "scripts/check-webapps.sh check-one apps/admin-panel 80 test:coverage"
admin_panel_typecheck_command = "scripts/check-webapps.sh check-one apps/admin-panel 80 typecheck"
api_clippy_command = '''if [ -f Cargo.toml ]; then cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -D clippy::mod_module_files; else printf '%s\n' 'No Cargo.toml found; skipping cargo clippy.'; fi'''
api_fmt_command = '''if [ -f Cargo.toml ]; then cargo fmt --all -- --check; else printf '%s\n' 'No Cargo.toml found; skipping cargo fmt.'; fi'''
api_test_command = '''if [ -f Cargo.toml ]; then cargo test --workspace; else printf '%s\n' 'No Cargo.toml found; skipping cargo test.'; fi'''
api_test_locked_command = '''if [ -f Cargo.toml ]; then cargo test --workspace --locked; else printf '%s\n' 'No Cargo.toml found; skipping cargo test-locked.'; fi'''
repo_bootstrap_command = '''if [ -f Cargo.toml ]; then cargo fetch; else printf '%s\n' 'No Cargo.toml found; skipping cargo bootstrap.'; fi && scripts/check-webapps.sh bootstrap'''
repo_compat_typescript_build_command = "scripts/check-webapps.sh build"
repo_compat_typescript_coverage_command = "scripts/check-webapps.sh coverage"
repo_compat_typescript_lint_command = "scripts/check-webapps.sh lint"
repo_compat_typescript_typecheck_command = "scripts/check-webapps.sh typecheck"
repo_frontend_contract_drift_command = "scripts/check-webapps.sh contracts-drift-check apps/web"
repo_frontend_public_boundary_command = "scripts/check-webapps.sh contracts-boundary-check apps/web"
web_build_command = "scripts/check-webapps.sh check-one apps/web 80 build:bundle"
web_lint_command = "scripts/check-webapps.sh check-one apps/web 80 lint"
web_test_command = "scripts/check-webapps.sh check-one apps/web 80 test:coverage"
web_typecheck_command = "scripts/check-webapps.sh check-one apps/web 80 typecheck"


[dev]
proxy_port = 1355
https_port = 1443
https = false
# HTTPS listener ALPN only; cleartext proxy traffic remains HTTP/1.1.
http2 = true
lan = false
# Must be localhost, local, test, internal, or a subdomain below one of them.
tld = "localhost"
# Set true to discover JavaScript workspace packages that expose dev scripts.
workspace_discovery = false


# Repo-local dev service.
[[dev.apps]]
name = "api"
dir = "."
kind = "env-port"
argv = ["cargo", "run", "-p", "exampleproject-api"]


# Repo-local dev service.
[[dev.apps]]
name = "admin-api"
dir = "."
kind = "env-port"
argv = ["cargo", "run", "-p", "exampleproject-admin-api"]



# Generated from [[frontend_apps]] so local dev uses explicit app settings while
# web CI keeps its coverage threshold metadata above. Jig validates that name
# and dir stay aligned with the matching frontend app.
[[dev.apps]]
name = "web"
dir = "apps/web"
kind = "vite"

argv = ["bun", "run", "dev"]



# Generated from [[frontend_apps]] so local dev uses explicit app settings while
# web CI keeps its coverage threshold metadata above. Jig validates that name
# and dir stay aligned with the matching frontend app.
[[dev.apps]]
name = "admin-panel"
dir = "apps/admin-panel"
kind = "vite"

argv = ["bun", "run", "dev"]



[execution]
command_timeout_seconds = 1800
command_output_limit_bytes = 67108864





