version = 1

[[rules]]
id = "rust-source"
category = "source"
include = ["**/*.rs"]
notice_lines = 400
warn_lines = 500
max_lines = 800

[[exclusions]]
pattern = "crates/jig-bootstrap/src/**/embedded_templates_snapshot.rs"
kind = "generated"
reason = "Template manifests regenerated by the jig-bootstrap build script; they grow with every embedded template"
