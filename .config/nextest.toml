# Keep repository test execution fast without overwhelming the external Node
# processes exercised by the generated frontend-check fixtures.
nextest-version = "0.9.130"

[profile.default]
fail-fast = false
# Keep process- and environment-heavy tests deterministic on high-core hosts.
test-threads = 4
# Surface stalled supported-host tests promptly; CI jobs retain their hard timeout.
slow-timeout = { period = "60s" }

[test-groups]
frontend-node = { max-threads = 2 }
process-signals = { max-threads = 1 }
vault-crypto = { max-threads = 4 }

[[profile.default.overrides]]
# Keep this group at a uniform weight. cargo-nextest 0.9.130 can strand
# heavier queued group members when unrelated tests saturate global slots.
filter = 'package(jig-sh) & (test(bootstrap::tests::frontend_adoption) | test(bootstrap::tests::basic::scaffold_generation) | test(bootstrap::tests::basic::scaffold_runtime))'
test-group = 'frontend-node'

[[profile.default.overrides]]
# These tests launch process trees and env-port helpers from a shared local
# range; serialize them so one test cannot claim another test's probed port.
filter = '(package(jig-sh) & (binary(codex_launcher) | binary(dev_lifecycle) | binary(dev_sigint))) | package(jig-owned-process) | (package(jig-dev-proxy) & test(processes))'
test-group = 'process-signals'

[[profile.default.overrides]]
# PTY browser tests exercise crypto-backed actions through interactive redraw
# deadlines. Reserve the full vault group so those deadlines measure the TUI
# rather than contention with parallel password hashing.
filter = 'package(jig-sh) & binary(vault_tui)'
test-group = 'vault-crypto'
threads-required = 4

[[profile.default.overrides]]
# Keep this broader filter after the vault_tui-specific override so nextest's
# first matching group/weight assignment preserves its four-thread reservation.
filter = 'package(jig-vault) | package(jig-vault-tui) | (package(jig-sh) & (test(vault) | binary(/vault_.*/)))'
test-group = 'vault-crypto'
