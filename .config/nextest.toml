# Keep repository test execution fast without overwhelming the external Node
# processes exercised by the generated frontend-check fixtures.
nextest-version = "0.9.130"

[profile.default]
fail-fast = false
# Keep process- and environment-heavy tests deterministic on high-core hosts.
test-threads = 4
# Surface stalled cross-platform tests promptly; CI jobs retain their hard timeout.
slow-timeout = { period = "60s" }

[test-groups]
frontend-node = { max-threads = 2 }
process-signals = { max-threads = 1 }
vault-crypto = { max-threads = 4 }

[[profile.default.overrides]]
# Keep this group at a uniform weight. cargo-nextest 0.9.130 can strand
# heavier queued group members when unrelated tests saturate global slots.
filter = 'package(jig-sh) & (test(bootstrap::tests::frontend_adoption) | test(bootstrap::tests::basic::scaffold_generation) | test(bootstrap::tests::basic::scaffold_runtime) | test(bootstrap::tests::windows_dependency_checker))'
test-group = 'frontend-node'

[[profile.default.overrides]]
filter = '(package(jig-sh) & (binary(codex_launcher) | binary(dev_sigint))) | package(jig-owned-process) | (package(jig-dev-proxy) & test(processes))'
test-group = 'process-signals'

[[profile.default.overrides]]
filter = 'package(jig-vault) | (package(jig-sh) & test(vault))'
test-group = 'vault-crypto'
