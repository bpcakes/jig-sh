# Keep repository test execution fast without overwhelming the external Node
# processes exercised by the generated frontend-check fixtures.
nextest-version = "0.9.130"

[profile.default]
fail-fast = false
# Keep process- and environment-heavy tests deterministic on high-core hosts.
test-threads = 4
# Surface stalled supported-host tests promptly; CI jobs retain their hard timeout.
slow-timeout = { period = "60s" }

[profile.local]
# Local checks optimize for the first actionable failure. CI intentionally uses
# the comprehensive default profile above.
fail-fast = true
# Match the proven CI ceiling for process-heavy fixtures. Scaling to every host
# CPU can overload process-tree supervision and turn successful Git and shell
# commands into cleanup failures.
test-threads = 4

[test-groups]
frontend-node = { max-threads = 2 }
frontend-node-local = { max-threads = 16 }
process-signals = { max-threads = 1 }
vault-crypto = { max-threads = 4 }
vault-tui-local = { max-threads = 64 }

[[profile.local.overrides]]
# Keep the PTY/browser deadline tests globally exclusive even when the local
# worker count scales beyond the default profile's four threads.
filter = 'package(jig-sh) & binary(vault_tui)'
test-group = 'vault-tui-local'
threads-required = "num-test-threads"

[[profile.local.overrides]]
# Scale isolated generated-frontend fixtures with the machine up to an
# evidence-backed 16-process ceiling. Beyond that, nested shell/Node process
# trees contend with timing-sensitive core tests even on a 64-thread host.
# The default profile retains its conservative CI limit below.
filter = 'package(jig-sh) & (test(bootstrap::tests::frontend_adoption) | test(bootstrap::tests::basic::scaffold_generation) | test(bootstrap::tests::basic::scaffold_runtime))'
test-group = 'frontend-node-local'

[[profile.local.overrides]]
# These checks intentionally enforce short transport and process-cleanup
# deadlines. Run them without other local-profile CPU/process-tree contention
# so the deadlines measure Jig rather than host saturation.
filter = 'package(jig-sh) & (binary(runtime_signal_policy) | test(mcp_repository_arguments_round_trip_from_wire_keys_into_native_actions) | test(mcp_work_refine_rejects_final_check_lease_contention_without_blocking_the_transport))'
test-group = 'process-signals'
threads-required = "num-test-threads"

[[profile.default.overrides]]
# Keep this group at a uniform weight. cargo-nextest 0.9.130 can strand
# heavier queued group members when unrelated tests saturate global slots.
filter = 'package(jig-sh) & (test(bootstrap::tests::frontend_adoption) | test(bootstrap::tests::basic::scaffold_generation) | test(bootstrap::tests::basic::scaffold_runtime))'
test-group = 'frontend-node'

[[profile.default.overrides]]
# These tests launch process trees and env-port helpers from a shared local
# range; serialize them so one test cannot claim another test's probed port.
filter = '(package(jig-sh) & (binary(codex_launcher) | binary(dev_lifecycle) | binary(dev_sigint) | binary(runtime_signal_policy))) | package(jig-owned-process) | (package(jig-dev-proxy) & test(processes))'
test-group = 'process-signals'

[[profile.default.overrides]]
# PTY browser tests exercise crypto-backed actions through interactive redraw
# deadlines. Reserve the full vault group so those deadlines measure the TUI
# rather than contention with parallel password hashing.
filter = 'package(jig-sh) & binary(vault_tui)'
test-group = 'vault-crypto'
threads-required = 4

[[profile.default.overrides]]
# Keep this broader filter after the vault_tui-specific override so nextest's
# first matching group/weight assignment preserves its four-thread reservation.
filter = 'package(jig-vault) | package(jig-vault-tui) | (package(jig-sh) & (test(vault) | binary(/vault_.*/)))'
test-group = 'vault-crypto'
