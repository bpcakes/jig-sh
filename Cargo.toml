[workspace]
members = [
    "crates/jig",
    "crates/jig-codex-tui",
    "crates/jig-contract",
    "crates/jig-core",
    "crates/jig-dev-proxy",
    "crates/jig-features",
    "crates/jig-owned-process",
    "crates/jig-rust",
    "crates/jig-sqlx",
    "crates/jig-status-tui",
    "crates/jig-tui",
    "crates/jig-typescript",
    "crates/jig-ui",
    "crates/jig-vault",
    "crates/jig-vault-tui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/bpcakes/jig-sh"
homepage = "https://github.com/bpcakes/jig-sh"
documentation = "https://github.com/bpcakes/jig-sh/tree/master/docs"
rust-version = "1.88"
version = "0.2.0"

[workspace.lints.clippy]
large_stack_arrays = "deny"
redundant_clone = "deny"

[workspace.dependencies]
aho-corasick = "1.1.4"
anyhow = "1.0.100"
argon2 = "0.5.3"
askama = { version = "0.15", default-features = false, features = ["derive", "std"] }
base64 = "0.22.1"
bytes = "1.10.1"
chacha20poly1305 = "0.10.1"
chrono = "0.4.42"
chrono-tz = "0.10.4"
clap = { version = "4.5.50", features = ["derive"] }
croner = "=3.0.1"
ctrlc = "3.5.0"
crossterm = "=0.28.1"
dirs = "6.0.0"
dotenvy = "0.15.7"
fs4 = "0.13.1"
flate2 = "1.1.9"
getrandom = "0.3.4"
hkdf = "0.12.4"
hmac = "0.12.1"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["full"] }
hyper-util = { version = "0.1.17", features = ["full"] }
jig-dev-proxy = { path = "crates/jig-dev-proxy", version = "=0.2.0" }
jig-contract = { path = "crates/jig-contract", version = "=0.2.0" }
jig-codex-tui = { path = "crates/jig-codex-tui", version = "=0.2.0" }
jig-core = { path = "crates/jig-core", version = "=0.2.0" }
jig-features = { path = "crates/jig-features", version = "=0.2.0" }
jig-owned-process = { path = "crates/jig-owned-process", version = "=0.2.0" }
jig-rust = { path = "crates/jig-rust", version = "=0.2.0" }
jig-sqlx = { path = "crates/jig-sqlx", version = "=0.2.0" }
jig-status-tui = { path = "crates/jig-status-tui", version = "=0.2.0" }
jig-tui = { path = "crates/jig-tui", version = "=0.2.0" }
jig-typescript = { path = "crates/jig-typescript", version = "=0.2.0" }
jig-ui = { path = "crates/jig-ui", version = "=0.2.0" }
jig-vault = { path = "crates/jig-vault", version = "=0.2.0" }
jig-vault-tui = { path = "crates/jig-vault-tui", version = "=0.2.0" }
jsonschema = { version = "0.48.5", default-features = false }
libc = "0.2.177"
rcgen = { version = "0.14", features = ["x509-parser"] }
# Ratatui 0.29's `Rect::area` uses u32, but `Buffer::pos_of` still narrows cell
# indices to u16 while diffing; TUI render areas must remain at most 65,535 cells.
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rpassword = "7.5"
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2.2.0"
schemars = "1.2.1"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
sha1 = "0.10.6"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.23.0"
terminal_size = "0.4.3"
time = "0.3.44"
tokio = { version = "1.48.0", features = ["full"] }
tokio-rustls = "0.26.1"
toml = "0.9.8"
ulid = "1.2.1"
# Ratatui 0.29 requires exactly unicode-width 0.2.0. Keep workspace consumers on
# that version; this temporarily uses Unicode 15.1 width data instead of
# unicode-width 0.2.2's Unicode 17 data.
unicode-width = "=0.2.0"
wait-timeout = "0.2.1"
x509-parser = { version = "0.18.1", features = ["verify"] }
zeroize = "1.8.2"
