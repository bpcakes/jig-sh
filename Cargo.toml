[workspace]
members = [
    "crates/jig",
    "crates/jig-agents",
    "crates/jig-agents-tui",
    "crates/jig-bootstrap",
    "crates/jig-commands",
    "crates/jig-context",
    "crates/jig-contract",
    "crates/jig-core",
    "crates/jig-dashboard",
    "crates/jig-dev-proxy",
    "crates/jig-execution",
    "crates/jig-features",
    "crates/jig-file-budget",
    "crates/jig-git",
    "crates/jig-go",
    "crates/jig-loops",
    "crates/jig-owned-process",
    "crates/jig-policy",
    "crates/jig-repository",
    "crates/jig-rust",
    "crates/jig-sqlx",
    "crates/jig-state",
    "crates/jig-tui",
    "crates/jig-typescript",
    "crates/jig-ui",
    "crates/jig-vault",
    "crates/jig-vault-tui",
]
resolver = "2"

[profile.test.package.argon2]
opt-level = 3

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/bpcakes/jig-sh"
homepage = "https://github.com/bpcakes/jig-sh"
documentation = "https://github.com/bpcakes/jig-sh/tree/master/docs"
rust-version = "1.88"
version = "0.8.1-dev"

[workspace.lints.clippy]
cognitive_complexity = "warn"
large_stack_arrays = "deny"
mod_module_files = "warn"
redundant_clone = "deny"

[workspace.dependencies]
aho-corasick = "1.1.4"
anyhow = "1.0.100"
argon2 = "0.5.3"
askama = { version = "0.15", default-features = false, features = ["derive", "std"] }
base64 = "0.22.1"
bytes = "1.10.1"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
chacha20poly1305 = "0.10.1"
chrono = "0.4.42"
chrono-tz = "0.10.4"
clap = { version = "4.5.50", features = ["derive"] }
croner = "=3.0.1"
ctrlc = "3.5.0"
crossterm = "=0.28.1"
dirs = "6.0.0"
dotenvy = "0.15.7"
fs4 = "0.13.1"
flate2 = "1.1.9"
getrandom = "0.3.4"
globset = "=0.4.20"
hkdf = "0.12.4"
hmac = "0.12.1"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["full"] }
hyper-util = { version = "0.1.17", features = ["full"] }
jig-agents = { path = "crates/jig-agents", version = "=0.8.1-dev" }
jig-bootstrap = { path = "crates/jig-bootstrap", version = "=0.8.1-dev" }
jig-dashboard = { path = "crates/jig-dashboard", version = "=0.8.1-dev" }
jig-dev-proxy = { path = "crates/jig-dev-proxy", version = "=0.8.1-dev" }
jig-commands = { path = "crates/jig-commands", version = "=0.8.1-dev" }
jig-context = { path = "crates/jig-context", version = "=0.8.1-dev" }
jig-contract = { path = "crates/jig-contract", version = "=0.8.1-dev" }
jig-agents-tui = { path = "crates/jig-agents-tui", version = "=0.8.1-dev" }
jig-core = { path = "crates/jig-core", version = "=0.8.1-dev" }
jig-execution = { path = "crates/jig-execution", version = "=0.8.1-dev" }
jig-features = { path = "crates/jig-features", version = "=0.8.1-dev" }
jig-file-budget = { path = "crates/jig-file-budget", version = "=0.8.1-dev" }
jig-git = { path = "crates/jig-git", version = "=0.8.1-dev" }
jig-go = { path = "crates/jig-go", version = "=0.8.1-dev" }
jig-loops = { path = "crates/jig-loops", version = "=0.8.1-dev" }
jig-owned-process = { path = "crates/jig-owned-process", version = "=0.8.1-dev" }
jig-policy = { path = "crates/jig-policy", version = "=0.8.1-dev" }
jig-repository = { path = "crates/jig-repository", version = "=0.8.1-dev" }
jig-rust = { path = "crates/jig-rust", version = "=0.8.1-dev" }
jig-sqlx = { path = "crates/jig-sqlx", version = "=0.8.1-dev" }
jig-state = { path = "crates/jig-state", version = "=0.8.1-dev" }
jig-tui = { path = "crates/jig-tui", version = "=0.8.1-dev" }
jig-typescript = { path = "crates/jig-typescript", version = "=0.8.1-dev" }
jig-ui = { path = "crates/jig-ui", version = "=0.8.1-dev" }
jig-vault = { path = "crates/jig-vault", version = "=0.8.1-dev" }
jig-vault-tui = { path = "crates/jig-vault-tui", version = "=0.8.1-dev" }
libc = "0.2.177"
proc-macro2 = "1.0.106"
rcgen = { version = "0.14", features = ["x509-parser"] }
# Ratatui 0.29's `Rect::area` uses u32, but `Buffer::pos_of` still narrows cell
# indices to u16 while diffing; TUI render areas must remain at most 65,535 cells.
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rpassword = "7.5"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
security-framework = "3.7.0"
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2.2.0"
schemars = "1.2.1"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
sha1 = "0.10.6"
sha2 = "0.10.9"
subtle = "2.6.1"
syn = { version = "2.0.117", features = ["full"] }
tempfile = "3.23.0"
terminal_size = "0.4.3"
time = "0.3.44"
tokio = { version = "1.48.0", features = ["full"] }
tokio-rustls = "0.26.1"
toml = "0.9.8"
ulid = "1.2.1"
# Ratatui 0.29 requires exactly unicode-width 0.2.0. Keep workspace consumers on
# that version; this temporarily uses Unicode 15.1 width data instead of
# unicode-width 0.2.2's Unicode 17 data.
unicode-width = "=0.2.0"
unicode-normalization = "0.1.24"
wait-timeout = "0.2.1"
x509-parser = { version = "0.18.1", features = ["verify"] }
zeroize = "1.8.2"
# New-passphrase strength estimate (MIT, declares Rust 1.66). Default features
# pull in derive_builder, which the vault does not use.
zxcvbn = { version = "3.1.1", default-features = false }
