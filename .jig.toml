[vault]
scope = "repo"
scope_id = "01M1A5GSHJ900Q1VN82A66PM1H"
allow_global = false


[commands]
api_test_locked_command = "bash scripts/ci/test-rust.sh workspace"


[dev]
proxy_port = 1355
https_port = 1443
https = false
# HTTPS listener ALPN only; cleartext proxy traffic remains HTTP/1.1.
http2 = true
lan = false
# Must be localhost, local, test, internal, or a subdomain below one of them.
tld = "localhost"
# Set true to discover JavaScript workspace packages that expose dev scripts.
workspace_discovery = false



[execution]
command_timeout_seconds = 1800
command_output_limit_bytes = 67108864





[[agent_tooling.codex.marketplaces]]
id = "jig-skills"
