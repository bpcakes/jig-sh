_commit = ""
_src_path = "embedded:jig-sh"
_template_mode = ""
_template_local_path = ""
repo_name = "jig-sh"
default_branch = "master"
ci_github_runner = "ubuntu-latest"
template_source_url = ""
harness_footprint = "full"

sqlx_enabled = false
rust_crate_roots = ["."]


schema_dump_enabled = false
schema_docs_dir = "docs/schema"


# Command values are project-owned. Generated Cargo defaults skip cleanly when
# no manifests are found; with nested manifests they run each one in turn.
# Review them against this repo's workspace layout and replace them when custom
# orchestration is needed.



web_package_manager = "bun"
application_contracts_enabled = false
frontend_workspace_roots = []

frontend_apps = []



[repository]
# .beads/ holds issue-tracker state only; see docs/beads-workflow.md.
tracker = "beads"
default_check_profile = "verify"
affected_ignore = [".env", ".env.*", "**/.env", "**/.env.*", "README.md", "**/README.md", "AGENTS.md", "**/AGENTS.md", "agent-map.md", "CHANGELOG.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "SECURITY.md", "docs/**", "LICENSE", "LICENSE.*", ".github/**"]

[[repository.components]]
id = "api"
root = "."
description = "Primary application backend."
tags = ["backend"]
propagate_affected_to_dependents = true
adapters = ["rust"]

[repository.components.provenance]
adapters = "inferred"
id = "inferred"
root = "inferred"

[[repository.components]]
id = "repo"
root = "."
description = "Repository-wide Jig policy and compatibility actions."
tags = ["repository"]
adapters = ["jig"]

[repository.components.provenance]
adapters = "inherited"
id = "inferred"
root = "inferred"

[[repository.actions]]
description = "Run Rust Clippy with repository policy."
intent = "check"
effects = ["read_only", "process"]
inputs = ["Cargo.toml", "Cargo.lock", "**/Cargo.toml", "**/Cargo.lock", "**/*.rs", "rust-toolchain", "rust-toolchain.toml", "**/rust-toolchain", "**/rust-toolchain.toml", ".cargo/**", "**/.cargo/**", "rustfmt.toml", ".rustfmt.toml", "**/rustfmt.toml", "**/.rustfmt.toml", "clippy.toml", ".clippy.toml", "**/clippy.toml", "**/.clippy.toml"]
inputs_policy = "whole_repository"
source_state = "git"
legacy_aliases = ["jig.clippy"]

[repository.actions.target]
component = "api"
action = "clippy"

[repository.actions.runner]
kind = "argv"
program = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--locked", "--", "-D", "warnings", "-D", "clippy::mod_module_files"]

[repository.actions.provenance]
effects = "inherited"
inputs = "inherited"
inputs_policy = "inferred"
intent = "inherited"
legacy_aliases = "inherited"
runner = "overridden"
source_state = "inferred"
target = "inherited"

