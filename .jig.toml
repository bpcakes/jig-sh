_commit = "52a8bdbf591b4f33dcc6a953686a37c5ff8aa5d4"
_src_path = "https://github.com/bpcakes/jig-sh.git"
_template_mode = "committed"
_template_local_path = ""
repo_name = "jig-sh"
default_branch = "master"
ci_github_runner = "ubuntu-latest"
template_source_url = "https://github.com/bpcakes/jig-sh.git"
harness_footprint = "full"
sqlx_enabled = false
rust_crate_roots = ["crates"]
schema_dump_enabled = false
schema_docs_dir = "docs/schema"
bootstrap_command = "cargo fetch"
rust_fmt_check_command = "scripts/check-rust-format.sh"
rust_clippy_command = "cargo clippy --workspace --all-targets --locked -- -D warnings"
rust_test_command = "cargo nextest run --workspace -P local --status-level fail --final-status-level fail"
rust_test_locked_command = "cargo nextest run --workspace --locked -E 'not (package(jig-vault) | package(jig-vault-tui) | (package(jig-sh) & (test(vault) | binary(/vault_.*/))))' --status-level fail --final-status-level fail && cargo nextest run --workspace --locked -E '(package(jig-vault) | package(jig-vault-tui) | (package(jig-sh) & (test(vault) | binary(/vault_.*/)))) & not (package(jig-sh) & binary(vault_tui))' --status-level fail --final-status-level fail && cargo nextest run -p jig-sh --test vault_tui --locked -j 1 --status-level fail --final-status-level fail"
web_package_manager = "bun"
application_contracts_enabled = false
frontend_workspace_roots = []
frontend_apps = []

[commands]
rust_file_loc_command = "scripts/check-rust-file-loc.sh master"
rust_core_test_command = "scripts/test-rust-partition.sh core"
rust_frontend_test_command = "scripts/test-rust-partition.sh frontend"
rust_vault_test_command = "scripts/test-rust-partition.sh vault"
rust_process_test_command = "scripts/test-rust-partition.sh process"

[execution]
# Applies to configured checks and Codex-backed work/loop workers.
command_timeout_seconds = 1800
# Applies per stream to authoritative configured-command output capture.
command_output_limit_bytes = 67108864

[dev]
# This source repo dogfoods the proxy runtime but does not auto-discover apps.
proxy_port = 1355
https_port = 1443
https = false
# HTTPS listener ALPN only; cleartext proxy traffic remains HTTP/1.1.
http2 = true
lan = false
# Must be localhost, local, test, internal, or a subdomain below one of them.
tld = "localhost"
# Keep false when legacy [[frontend_apps]] are configured; set true to discover
# JavaScript workspace packages that expose dev scripts.
workspace_discovery = false
# Explicit [[dev.apps]] entries are authoritative. Legacy [[frontend_apps]]
# entries remain a fallback when no dev apps are configured.

[[work.gates]]
id = "jig-contract"
kind = "check"
tool = "jig.contract_check"

[[work.gates]]
id = "rust-file-loc"
kind = "check"
tool = "jig.rust_file_loc"

[[work.gates]]
id = "source-rust-fmt"
kind = "check"
tool = "jig.source_fmt_check"
paths = ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain*", ".cargo/**", "rustfmt.toml", ".rustfmt.toml", "scripts/check-rust-format.sh"]
reuse = true

[[work.gates]]
id = "rust-clippy"
kind = "check"
tool = "jig.clippy"
paths = ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain*", ".cargo/**", "clippy.toml", ".clippy.toml"]
reuse = true

[[work.gates]]
id = "source-rust-core-tests"
kind = "check"
tool = "jig.source_core_test"
paths = ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain*", ".cargo/**", "nextest.toml", ".config/nextest.toml", ".jig.toml", "templates/**", "scripts/**", "examples/**", "tests/**"]
reuse = true

[[work.gates]]
id = "source-rust-frontend-tests"
kind = "check"
tool = "jig.source_frontend_test"
paths = ["crates/jig/src/bootstrap.rs", "crates/jig/src/bootstrap/**", "Cargo.toml", "Cargo.lock", "rust-toolchain*", ".cargo/**", "nextest.toml", ".config/nextest.toml", ".jig.toml", "templates/**", "scripts/test-rust-partition.sh", "tests/fixtures/**"]
reuse = true

[[work.gates]]
id = "source-rust-vault-tests"
kind = "check"
tool = "jig.source_vault_test"
paths = ["crates/jig-vault/**", "crates/jig-vault-tui/**", "crates/jig-tui/**", "crates/jig/src/cli.rs", "crates/jig/src/**/vault*.rs", "crates/jig/src/**/vault/**", "crates/jig/src/command/vault.rs", "crates/jig/src/runtime.rs", "crates/jig/tests/vault_*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain*", ".cargo/**", "nextest.toml", ".config/nextest.toml", ".jig.toml", "templates/**", "scripts/test-rust-partition.sh"]
reuse = true

[[work.gates]]
id = "source-rust-process-tests"
kind = "check"
tool = "jig.source_process_test"
paths = ["crates/jig-owned-process/**", "crates/jig-dev-proxy/**", "crates/jig/src/main.rs", "crates/jig/src/cli.rs", "crates/jig/src/runtime.rs", "crates/jig/src/codex.rs", "crates/jig/src/codex/**", "crates/jig/src/dev_proxy.rs", "crates/jig/src/dev_proxy/**", "crates/jig/src/cli/codex*.rs", "crates/jig/src/cli/dev*.rs", "crates/jig/src/doctor/signal_session.rs", "crates/jig/tests/codex_launcher.rs", "crates/jig/tests/dev_lifecycle.rs", "crates/jig/tests/dev_sigint.rs", "crates/jig/tests/dev_sigint_parts/**", "Cargo.toml", "Cargo.lock", "rust-toolchain*", ".cargo/**", "nextest.toml", ".config/nextest.toml", ".jig.toml", "scripts/test-rust-partition.sh"]
reuse = true

[[agent_tooling.codex.marketplaces]]
id = "jig-skills"
source = "bpcakes/jig-skills"
plugins = [
  "jig-rust@jig-skills",
  "jig-swift@jig-skills",
  "jig-typescript@jig-skills",
  "jig-exec-plans@jig-skills",
]
