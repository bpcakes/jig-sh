[[repository.components]]
adapters = ["rust"]
description = "Primary application backend."
id = "api"
propagate_affected_to_dependents = true
root = "."
tags = ["backend"]

[repository.components.provenance]
adapters = "inferred"
id = "inferred"
root = "inferred"

[[repository.components]]
adapters = ["jig"]
description = "Repository-wide Jig policy and compatibility actions."
id = "repo"
root = "."
tags = ["repository"]

[repository.components.provenance]
adapters = "inherited"
id = "inferred"
root = "inferred"

[[repository.profiles]]
# Require independent checks together without making their receipts prerequisites
# of tests. Reserve action depends_on for actual execution prerequisites.
description = "Default repository verification targets."
id = "verify"

[repository.profiles.provenance]
id = "inferred"
targets = "inherited"

[[repository.profiles.targets]]
action = "clippy"
component = "api"

[[repository.profiles.targets]]
