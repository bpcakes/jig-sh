_commit = ""
_src_path = "embedded:jig-sh"
_template_local_path = ""
_template_mode = ""
application_contracts_enabled = false
ci_github_runner = "ubuntu-latest"
default_branch = "master"
frontend_apps = []
frontend_workspace_roots = []
harness_footprint = "full"
repo_name = "jig-sh"
rust_crate_roots = ["."]
schema_docs_dir = "docs/schema"
schema_dump_enabled = false
sqlx_enabled = false
template_source_url = ""
web_package_manager = "bun"

[[agent_tooling.codex.marketplaces]]
id = "jig-skills"
plugins = [
    "jig-rust@jig-skills",
    "jig-swift@jig-skills",
    "jig-typescript@jig-skills",
    "jig-exec-plans@jig-skills",
]
source = "bpcakes/jig-skills"

[commands]
api_test_locked_command = "cargo nextest run --workspace --locked -E 'not (package(jig-vault) | package(jig-vault-tui) | (package(jig-sh) & (test(vault) | binary(/vault_.*/))))' --status-level fail --final-status-level fail && cargo nextest run --workspace --locked -E '(package(jig-vault) | package(jig-vault-tui) | (package(jig-sh) & (test(vault) | binary(/vault_.*/)))) & not (package(jig-sh) & binary(vault_tui))' --status-level fail --final-status-level fail && cargo nextest run -p jig-sh --test vault_tui --locked -j 1 --status-level fail --final-status-level fail"

[dev]
http2 = true
https = false
https_port = 1443
lan = false
proxy_port = 1355
tld = "localhost"
workspace_discovery = false

[execution]
command_output_limit_bytes = 67108864
command_timeout_seconds = 1800

[repository]
affected_ignore = [
    ".env",
    ".env.*",
    "**/.env",
    "**/.env.*",
    "README.md",
    "**/README.md",
    "AGENTS.md",
    "**/AGENTS.md",
    "agent-map.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "docs/**",
    "LICENSE",
    "LICENSE.*",
    ".github/**",
]
default_check_profile = "verify"

[[repository.actions]]
description = "Run Rust Clippy with repository policy."
effects = [
    "read_only",
    "process",
]
inputs = [
    "Cargo.toml",
    "Cargo.lock",
    "**/Cargo.toml",
    "**/Cargo.lock",
    "**/*.rs",
    "rust-toolchain",
    "rust-toolchain.toml",
    "**/rust-toolchain",
    "**/rust-toolchain.toml",
    ".cargo/**",
    "**/.cargo/**",
    "rustfmt.toml",
    ".rustfmt.toml",
    "**/rustfmt.toml",
    "**/.rustfmt.toml",
    "clippy.toml",
    ".clippy.toml",
    "**/clippy.toml",
    "**/.clippy.toml",
]
intent = "check"
legacy_aliases = ["jig.clippy"]

[repository.actions.provenance]
effects = "inherited"
inputs = "inherited"
intent = "inherited"
legacy_aliases = "inherited"
runner = "overridden"
target = "inherited"

[repository.actions.runner]
kind = "argv"
program = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--locked", "--", "-D", "warnings", "-D", "clippy::mod_module_files"]

[repository.actions.target]
action = "clippy"
component = "api"

