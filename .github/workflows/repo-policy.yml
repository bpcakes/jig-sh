name: Repo Policy

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".jig.toml"
      - ".agent/jig-contract.json"
      - ".jig/file-budget.toml"
      - "scripts/jig"
      - "scripts/install-jig.sh"
      - ".github/workflows/repo-policy.yml"
  push:
    branches:
      - master
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".jig.toml"
      - ".agent/jig-contract.json"
      - ".jig/file-budget.toml"
      - "scripts/jig"
      - "scripts/install-jig.sh"
      - ".github/workflows/repo-policy.yml"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-policy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-mod-rs:
    name: Check for disallowed mod.rs files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          cache: false
          rustflags: ""
      - name: Build current Jig binary
        run: cargo build -p jig-sh --bin jig --locked
      - name: Detect disallowed mod.rs files
        env:
          JIG_DEV_BIN: target/debug/jig
        run: |
          scripts/jig check no-mod-rs

  file-budget:
    name: Enforce repository file budgets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          cache: false
          rustflags: ""
      - name: Build current Jig binary
        run: cargo build -p jig-sh --bin jig --locked
      - name: Check repository file-budget policy
        env:
          JIG_DEV_BIN: target/debug/jig
          JIG_EVENT_NAME: ${{ github.event_name }}
          JIG_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          JIG_PUSH_BEFORE: ${{ github.event.before }}
          JIG_MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "$JIG_EVENT_NAME" in
            pull_request)
              scripts/jig check repo:file-budget \
                --comparison-exact-tree "$JIG_PULL_REQUEST_BASE" \
                --comparison-provenance explicit
              ;;
            push)
              scripts/jig check repo:file-budget \
                --comparison-exact-tree "$JIG_PUSH_BEFORE" \
                --comparison-provenance push_before
              ;;
            merge_group)
              scripts/jig check repo:file-budget \
                --comparison-exact-tree "$JIG_MERGE_GROUP_BASE" \
                --comparison-provenance explicit
              ;;
            *)
              scripts/jig check repo:file-budget
              ;;
          esac
