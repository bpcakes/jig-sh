name: Repo Policy

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".clippy.toml"
      - "clippy.toml"
      - ".config/nextest.toml"
      - ".jig.toml"
      - ".jig/source-runtime-version"
      - ".agent/jig-contract.json"
      - "scripts/**"
      - "templates/project/**"
      - "templates/scaffolds/**"
      - "examples/**"
      - "tests/fixtures/**"
      - ".cargo/**"
      - ".github/workflows/rust-tests.yml"
      - ".jig/file-budget.toml"
      - ".github/workflows/repo-policy.yml"
      - ".beadroll.json"
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "agent-map.md"
  # Merges to master are checked together each night instead of one by one.
  schedule:
    - cron: "23 4 * * *"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-policy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nightly-gate:
    # A nightly run skips every job when this workflow's last nightly run
    # already checked the current master commit.
    if: ${{ github.event_name == 'schedule' }}
    name: Check for untested master commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: scripts/ci
      - name: Compare with the last nightly run
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/nightly-scope.py

  clippy:
    needs: nightly-gate
    if: ${{ !cancelled() && needs.nightly-gate.outputs.run != 'false' }}
    name: Rust lint and repository policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests check Linux only; nightly, merge queue, and manual
        # runs add macOS. A matrix include entry would add macOS back, so
        # per-platform settings are derived from matrix.os below.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    env:
      JIG_DEV_BIN: target/debug/jig
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # File budgets need the event's comparison tree, including merge groups.
          fetch-depth: 0
      - name: Select policy checks
        id: scope
        run: python3 scripts/ci/policy-scope.py
      - name: Install Rust toolchain
        if: ${{ runner.os == 'Linux' || steps.scope.outputs.rust != 'false' }}
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          cache: false
          rustflags: ""
          components: clippy
      - name: Cache Rust artifacts
        if: ${{ runner.os == 'Linux' || steps.scope.outputs.rust != 'false' }}
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          # Cache all three command configurations from this job together.
          shared-key: rust-${{ runner.os }}-${{ matrix.os == 'macos-latest' && 'clippy-macos' || 'clippy' }}-combined-v1
      - name: Build current Jig binary
        if: ${{ runner.os == 'Linux' || steps.scope.outputs.rust != 'false' }}
        id: build
        run: cargo build -p jig-sh --bin jig --locked
      - name: Check production vault features
        if: ${{ runner.os == 'Linux' || steps.scope.outputs.rust != 'false' }}
        run: |
          python3 scripts/check-vault-production-features.py
          python3 -m unittest discover -s scripts/tests -p 'test_vault_production_features.py'
      - name: Test tracker triage adapter
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: python3 -m unittest discover -s scripts/tests -p 'test_bead_triage.py'
      - name: Validate agent-map links and coverage
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build.outcome == 'success' }}
        run: scripts/jig check agent-map
      - name: Check repository file-budget policy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          JIG_EVENT_NAME: ${{ github.event_name }}
          JIG_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          JIG_PUSH_BEFORE: ${{ github.event.before }}
          JIG_MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          JIG_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$JIG_EVENT_NAME" in
            pull_request)
              scripts/jig check repo:file-budget \
                --comparison-exact-tree "$JIG_PULL_REQUEST_BASE" \
                --comparison-provenance explicit
              ;;
            push)
              scripts/jig check repo:file-budget \
                --comparison-exact-tree "$JIG_PUSH_BEFORE" \
                --comparison-provenance push_before
              ;;
            merge_group)
              scripts/jig check repo:file-budget \
                --comparison-exact-tree "$JIG_MERGE_GROUP_BASE" \
                --comparison-provenance explicit
              ;;
            workflow_dispatch|schedule)
              # Checkout fetches remote refs but creates only the selected local branch.
              # Scheduled events may omit repository metadata; they run on the default branch.
              comparison_base="$(git merge-base HEAD "refs/remotes/origin/${JIG_DEFAULT_BRANCH:-$GITHUB_REF_NAME}")"
              scripts/jig check repo:file-budget \
                --comparison-exact-tree "$comparison_base" \
                --comparison-provenance explicit
              ;;
          esac
      - name: Run clippy
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.scope.outputs.rust != 'false' }}
        run: scripts/jig check clippy
      - name: Run no-default-features clippy
        if: ${{ !cancelled() && steps.scope.outputs.rust != 'false' }}
        run: cargo clippy -p jig-sh -p jig-bootstrap --no-default-features --all-targets --locked -- -D warnings
      - name: Run serial dev proxy tests
        if: ${{ !cancelled() && steps.scope.outputs.rust != 'false' }}
        # Preserve the standard harness's process-global signal/trust coverage
        # alongside the full workspace's process-per-test Nextest coverage.
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test -p jig-dev-proxy --locked
      - name: Run dev proxy clippy
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.scope.outputs.rust != 'false' }}
        run: cargo clippy -p jig-dev-proxy --all-targets --locked -- -D warnings
