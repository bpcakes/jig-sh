# Manual infrastructure acceptance; do not replace normal repository CI.
name: Shared runner concurrency smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Concurrent slot ${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on:
      group: bpcakes
      labels: [bpcakes-ci, 'bpcakes-ci-slot-${{ matrix.slot }}']
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: smoke-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SLOT: ${{ matrix.slot }}
      POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
    steps:
      - name: Check aggregate resource limits and Docker isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(nproc)" = 8
          slice="/sys/fs/cgroup/ci.slice/ci-slot${SLOT}.slice"
          test "$(cat "$slice/memory.max")" = 12884901888
          test "$(cat "$slice/cpu.max")" = '800000 100000'
          docker info --format 'engine={{.ID}} root={{.DockerRootDir}}'
          test "$(docker info --format '{{.DockerRootDir}}')" = "/var/lib/bpcakes-ci/docker${SLOT}"
          test "$(sudo docker info --format '{{.ID}}')" = "$(docker info --format '{{.ID}}')"
          test "$(docker inspect --format '{{.HostConfig.CgroupParent}}' "$POSTGRES_CONTAINER")" = "ci-slot${SLOT}.slice"
          pid=$(docker inspect --format '{{.State.Pid}}' "$POSTGRES_CONTAINER")
          grep -F "/ci.slice/ci-slot${SLOT}.slice/" "/proc/$pid/cgroup"
          systemctl --user is-system-running
      - name: Require both jobs to serve PostgreSQL on the same port simultaneously
        shell: bash
        run: |
          set -euo pipefail
          barrier="/var/tmp/ci-concurrency-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install -d -m 1777 "$barrier"
          touch "$barrier/slot-$SLOT"
          ready=false
          for attempt in $(seq 1 90); do
            if test -f "$barrier/slot-1" && test -f "$barrier/slot-2"; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          for attempt in $(seq 1 6); do
            python3 -c 'import socket; socket.create_connection(("127.0.0.1", 5432), 5).close()'
            docker run --rm --network host -e PGPASSWORD=smoke-only postgres:18 psql -h 127.0.0.1 -U postgres -c 'SELECT 1'
            sleep 5
          done
          test "$(docker ps -q | wc -l | tr -d ' ')" = 1
          echo "Slot $SLOT passed simultaneous port and resource checks."
