# Temporary validation branch: dispatch only; do not merge over normal CI.
name: Rust Tests

on:
  workflow_dispatch:
    inputs:
      remaining_checks_only:
        description: Run proxy regressions and vault phases after the first acceptance run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shared-runner-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux shared-runner validation
    runs-on:
      group: bpcakes
      labels: bpcakes-ci
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install Node for generated-project tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          cache: false
          rustflags: ""
      - name: Install Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-nextest@0.9.130
      - name: Build current Jig binary
        run: cargo build -p jig-sh --bin jig --locked
      - name: Run locked Rust tests
        if: ${{ !inputs.remaining_checks_only }}
        env:
          JIG_DEV_BIN: target/debug/jig
          JIG_REQUIRE_GO_TOOLCHAIN: "1"
        run: scripts/jig check test-locked
      - name: Verify proxy cleanup with the runner user session
        if: ${{ inputs.remaining_checks_only }}
        run: >-
          cargo nextest run -p jig-sh --test dev_lifecycle --locked
          -E 'test(proxy_certificates)' --status-level fail --final-status-level fail
      - name: Run remaining vault tests
        if: ${{ inputs.remaining_checks_only }}
        run: >-
          cargo nextest run --workspace --locked
          -E '(package(jig-vault) | package(jig-vault-tui) | (package(jig-sh) & (test(vault) | binary(/vault_.*/)))) & not (package(jig-sh) & binary(vault_tui))'
          --status-level fail --final-status-level fail
      - name: Run remaining vault terminal tests
        if: ${{ inputs.remaining_checks_only }}
        run: >-
          cargo nextest run -p jig-sh --test vault_tui --locked -j 1
          --status-level fail --final-status-level fail
      - name: Validate the current source runtime through the launcher
        env:
          JIG_DEV_BIN: target/debug/jig
        run: scripts/jig check repo:source-runtime-check
