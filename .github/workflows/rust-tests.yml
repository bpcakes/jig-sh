name: Rust Tests

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".clippy.toml"
      - "clippy.toml"
      - ".config/nextest.toml"
      - ".jig.toml"
      - ".jig/source-runtime-version"
      - ".agent/jig-contract.json"
      - "scripts/**"
      - "templates/project/**"
      - "templates/scaffolds/**"
      - "examples/**"
      - "tests/fixtures/**"
      - ".cargo/**"
      - ".github/workflows/rust-tests.yml"
  # Merges to master are tested together each night instead of one by one.
  schedule:
    - cron: "23 4 * * *"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nightly-gate:
    # A nightly run skips every job when this workflow's last nightly run
    # already tested the current master commit.
    if: ${{ github.event_name == 'schedule' }}
    name: Check for untested master commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: scripts/ci
      - name: Compare with the last nightly run
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/nightly-scope.py

  rendered-fixtures:
    needs: nightly-gate
    if: ${{ !cancelled() && needs.nightly-gate.outputs.run != 'false' }}
    name: Validate rendered fixtures and generated Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JIG_FIXTURE_TARGET_DIR: ${{ github.workspace }}/.agent/.cache/fixture-builds
      JIG_GENERATED_RUST_TARGET_DIR: ${{ github.workspace }}/.agent/.cache/generated-rust-builds
      # Path/profile/compatibility fixtures need real installs, not optimized code.
      # The isolated Git installation retains production optimization except on
      # pull requests, where building it from scratch optimized took ~4 minutes.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
      JIG_FIXTURE_GIT_INSTALL_INHERIT_OPT_LEVEL: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          cache: false
          rustflags: ""
          components: clippy
      # Install every compiler before rust-cache calculates its toolchain key.
      - name: Install generated-project Rust toolchains
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy
          rustup toolchain install 1.94.0 --profile minimal --component clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: rust-${{ runner.os }}-${{ github.job }}-fixtures-v4
          cache-directories: |
            ${{ env.JIG_FIXTURE_TARGET_DIR }}
            ${{ env.JIG_GENERATED_RUST_TARGET_DIR }}
      - name: Build current Jig binary
        id: build
        run: cargo build -p jig-sh --bin jig --locked
      - name: Validate generated Rust Clippy policy
        env:
          JIG_DEV_BIN: target/debug/jig
          JIG_GENERATED_RUST_ONLY_TOOLCHAIN: 1.88.0
          JIG_GENERATED_RUST_REACT_TOOLCHAIN: 1.94.0
        run: bash scripts/check-generated-rust-clippy.sh
      - name: Validate behavioral fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # Reuse the binary built above even if Git metadata was refreshed by
        # generated-project checks. Source inputs have not changed.
        env:
          JIG_DEV_BIN: target/debug/jig
        run: bash scripts/validate-fixtures.sh

  test:
    needs: nightly-gate
    if: ${{ !cancelled() && needs.nightly-gate.outputs.run != 'false' }}
    name: Locked Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Pull requests test only what their changes can affect, compared
          # with the merge commit's first parent, the base branch tip.
          fetch-depth: 2
      - name: Install Node.js for generated frontend tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Pin Node for predictable frontend fixture performance on each platform.
          node-version: ${{ runner.os == 'macOS' && '24' || '22' }}
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          cache: false
          rustflags: ""
      - name: Install Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-nextest@0.9.130
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: rust-${{ runner.os }}-${{ github.job }}
      - name: Build and validate the current source runtime through the launcher
        # Pull requests skip this build, which the tests cannot reuse. Repo
        # Policy runs the same check with the binary it already builds.
        if: ${{ github.event_name != 'pull_request' }}
        run: scripts/jig-dev check contract
      - name: Start the systemd user manager
        run: bash scripts/ci/setup-user-systemd.sh
      - name: Run locked Rust tests
        env:
          JIG_DEV_BIN: target/debug/jig
          JIG_REQUIRE_GO_TOOLCHAIN: "1"
          JIG_TEST_AFFECTED_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        # Pull requests run a copy of .jig.toml's test-locked command, kept in
        # sync by scripts/tests/test_jig_ci_tests.py, the way the launcher
        # does: from the checkout root, with JIG_REPO_ROOT set to it and no
        # stdin, failing if the tests change the checkout.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            exec scripts/jig check test-locked
          fi
          before="$(git status --porcelain)"
          JIG_REPO_ROOT="$(pwd -P)" bash scripts/ci/test-rust.sh workspace </dev/null
          if [ "$(git status --porcelain)" != "$before" ]; then
            echo "::error::The tests changed files in the checkout."
            git status --short
            exit 1
          fi
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-timings-${{ github.job }}
          path: .agent/.cache/test-reports/**/*.xml
          include-hidden-files: true
          retention-days: 7

  test-macos:
    needs: nightly-gate
    if: ${{ !cancelled() && needs.nightly-gate.outputs.run != 'false' }}
    name: Locked Rust tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Pull requests test only what their changes can affect, compared
          # with the merge commit's first parent, the base branch tip.
          fetch-depth: 2
      - name: Check launcher parity with macOS Bash 3.2
        # This job uniquely exercises the installer's empty-array handoff on Apple's stock Bash.
        run: /bin/bash scripts/check-launcher-template.sh
      - name: Test source runtime selection and development entrypoint
        run: python3 -m unittest discover -s scripts/tests -p 'test_jig_*.py'
      - name: Install Node.js for generated frontend tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Pin Node for predictable frontend fixture performance on each platform.
          node-version: ${{ runner.os == 'macOS' && '24' || '22' }}
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          cache: false
          rustflags: ""
      - name: Install Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install cargo-nextest
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-nextest@0.9.130
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: rust-${{ runner.os }}-${{ github.job }}
      - name: Build and validate the current source runtime through the launcher
        # Pull requests skip this build, which the tests cannot reuse. Repo
        # Policy checks only Linux on pull requests, so the step after the
        # tests runs the test build's binary through the launcher instead.
        if: ${{ github.event_name != 'pull_request' }}
        run: scripts/jig-dev check contract
      - name: Run locked Rust tests
        env:
          JIG_DEV_BIN: target/debug/jig
          JIG_REQUIRE_GO_TOOLCHAIN: "1"
          JIG_TEST_AFFECTED_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
          # Pull requests leave jig-bootstrap's platform-neutral rendering,
          # adoption and generated-toolchain tests, about half of macOS test
          # time, to Linux. They keep its tests of paths where macOS differs:
          # git and /private/var path aliases, no-replace publication, flock
          # guards, open-file accounting through /dev/fd, installer snippets
          # and generated scripts under Bash 3.2, and ps-based install lock
          # identity. Nightly runs keep every test.
          JIG_TEST_EXCLUDE: >-
            ${{ github.event_name == 'pull_request' && 'package(jig-bootstrap) & not (
            test(/^git::tests::/) |
            test(/^runtime_cache_lock::tests::/) |
            test(/^update_transaction::tests::/) |
            test(/^tests::launcher_repair_/) |
            test(/^tests::repair_seed_/) |
            test(/^tests::basic::path_and_git::/) |
            test(/^tests::basic::init_safety::publication::/) |
            test(/^tests::basic::init_safety::rollback::/) |
            test(/^tests::basic::init_safety::preflight::/) |
            test(/^tests::basic::init_safety::generation_budget::/) |
            test(/^tests::template_source::(git_|non_git_)?local_source_stamp_/) |
            test(/^tests::template_source::source_stamp::/) |
            test(/^tests::frontend_adoption::configuration::package_managers::/) |
            test(/^tests::frontend_adoption::install_locking::generated_web_checks_wait_/) |
            test(/^tests::frontend_adoption::install_locking::generated_web_checks_recover_/) |
            test(/^tests::frontend_adoption::install_locking::generated_web_install_worker_/))'
            || '' }}
        # The launcher's limit (command_timeout_seconds in .jig.toml), which
        # the direct run lacks.
        timeout-minutes: 30
        # Pull requests run a copy of .jig.toml's test-locked command, kept in
        # sync by scripts/tests/test_jig_ci_tests.py, the way the launcher
        # does: from the checkout root, with JIG_REPO_ROOT set to it and no
        # stdin, failing if the tests change the checkout.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            exec scripts/jig check test-locked
          fi
          before="$(git status --porcelain)"
          JIG_REPO_ROOT="$(pwd -P)" bash scripts/ci/test-rust.sh workspace </dev/null
          if [ "$(git status --porcelain)" != "$before" ]; then
            echo "::error::The tests changed files in the checkout."
            git status --short
            exit 1
          fi
      - name: Check the launcher hands off to the test build
        # Pull requests otherwise run no macOS binary through the launcher and
        # installer. The test build's binary needs no further compile.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          JIG_DEV_BIN: target/debug/jig
        run: scripts/jig check contract
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-timings-${{ github.job }}
          path: .agent/.cache/test-reports/**/*.xml
          include-hidden-files: true
          retention-days: 7

  no-default-features-macos:
    needs: nightly-gate
    # Pull requests rely on the Linux no-default-features tests in Repo Policy;
    # nightly, merge queue, and manual runs repeat the full minimal suite on
    # macOS.
    if: ${{ !cancelled() && needs.nightly-gate.outputs.run != 'false' && github.event_name != 'pull_request' }}
    name: cargo test -p jig-sh --no-default-features (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Node.js for generated frontend tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Pin Node for predictable frontend fixture performance on each platform.
          node-version: ${{ runner.os == 'macOS' && '24' || '22' }}
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          cache: false
          rustflags: ""
      - name: Install cargo-nextest
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-nextest@0.9.130
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: rust-${{ runner.os }}-${{ github.job }}
      - name: Run no-default-features tests
        run: bash scripts/ci/test-rust.sh minimal
      # Nextest does not run doctests. Preserve cargo test's documentation coverage.
      - name: Run no-default-features doctests
        run: cargo test -p jig-sh --no-default-features --doc --locked
      - name: Upload test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-timings-${{ github.job }}
          path: .agent/.cache/test-reports/**/*.xml
          include-hidden-files: true
          retention-days: 7
